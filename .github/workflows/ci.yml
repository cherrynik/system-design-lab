name: Verify platform

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"
          cache-dependency-path: api/go.mod

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Install browser runtime
        working-directory: web
        run: pnpm exec playwright install --with-deps chromium

      - name: Verify frontend architecture, stories, and tests
        working-directory: web
        run: pnpm check

      - name: Build application and Storybook
        working-directory: web
        run: |
          pnpm build
          pnpm storybook:build

      - name: Verify browser workflows
        working-directory: web
        env:
          PLAYWRIGHT_GO_RUNNER: go
        run: pnpm exec playwright test --workers=1

      - name: Verify backend
        working-directory: api
        run: |
          go test -race ./...
          go vet ./...
          go build ./...
