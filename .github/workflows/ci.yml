name: Verify platform

on:
  workflow_dispatch:
    inputs:
      run_browser_workflows:
        description: "Run the full browser workflow suite"
        type: boolean
        default: false
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"
          cache-dependency-path: api/go.mod

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Install browser runtime
        working-directory: web
        run: pnpm exec playwright install --with-deps chromium

      - name: Verify frontend architecture, stories, and tests
        working-directory: web
        run: pnpm check

      - name: Build application and Storybook
        working-directory: web
        run: |
          pnpm build
          pnpm storybook:build

      - name: Verify browser workflows
        if: github.event_name == 'workflow_dispatch' && inputs.run_browser_workflows
        working-directory: web
        env:
          PLAYWRIGHT_GO_RUNNER: go
        run: pnpm exec playwright test --workers=1

      - name: Verify backend
        working-directory: api
        run: |
          go test -race ./...
          go vet ./...
          go build ./...

  pages:
    name: Build and verify Pages
    needs: verify
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"
          cache-dependency-path: api/go.mod
      - run: pnpm install --frozen-lockfile
      - name: Build the static app and browser Go runtime
        working-directory: web
        run: pnpm build:pages
      - name: Verify static deployment without an API server
        working-directory: web
        run: |
          pnpm exec playwright install --with-deps chromium
          pnpm test:pages
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Rebuild for the configured domain path
        working-directory: web
        env:
          VITE_BASE_PATH: ${{ steps.pages.outputs.base_path }}/
        run: pnpm build:pages
      - name: Verify the canvas on its production hostname
        working-directory: web
        env:
          VITE_BASE_PATH: ${{ steps.pages.outputs.base_path }}/
          PAGES_PUBLIC_URL: ${{ steps.pages.outputs.base_url }}/
        run: pnpm test:pages
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    name: Publish Pages
    needs: pages
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
